<title>AOI extraction pipeline — four phases</title>
<desc>Same synthetic SERP rendered four ways: Phase A row-projection geometry, Phase B HTML semantic typing across element types, Phase C spatial join binding labels to geometry by document order, Phase D midpoint-split gap-fill extending adjacent organic bboxes to a shared midpoint.</desc>
